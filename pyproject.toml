[project]
name = "space-rds"
version = "1.0.0"
description = "Space RDS quarterly pipeline - TFP Exposure Management"
requires-python = ">=3.10"
dependencies = ["pandas", "openpyxl", "pyyaml"]

[project.scripts]
space-rds = "run_space_rds:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["run_space_rds"]
packages = ["src"]
