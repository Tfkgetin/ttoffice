# ---- Pipeline-side population exclusions ----
# Drop layers whose Placing_Basis matches (case-insensitive). The SQL view only
# filters 'Consortium Declaration'; this removes plain 'Consortium' too without
# altering shared SQL. Excluded layers are listed on the Excluded sheet.
exclude_placing_basis:
  - "Consortium"

# ============================================================================
# S3123 (Syndicate 3123 / Lloyd's) RDS
# ----------------------------------------------------------------------------
# Produces Syndicate 3123's OWN return, reported on a separate "S3123 RDS" tab,
# alongside the IG book. Automated via spacepkg/s3123.py + s3123_sheet.py.
# Same RPF bands + per-risk loss formula as IG; differs only in:
#   * share      : S3123 sub-share = per_sc * s3123_factor (12.5/30, 15/30,
#                  10/30), GATED by consortium eligibility (FIX recon 2026Q1:
#                  the gate was missing — non-consortium 2022 lines leaked in
#                  and SXM-10 wrongly became the syndicate Max Risk)
#   * selection  : Lloyd's caps (see scenarios below)
#   * SD damage  : share * RPF (time-decay) — NOT the IG flat 0.40 LEO ratio.
#                  OPEN (O1): JJ's 2026Q1 workings use an altitude-grouped
#                  basis; method + per-line share source (schedule-derived vs
#                  actual signed lines from the Lloyd's view) to be agreed
#                  with JJ before next filing.
#   * netting    : net = gross * 0.80 = 20% QS ceded back to IG (same cession
#                  that lands in the IG number as s3123_qs; excluded s/c retain 100%)
# ============================================================================
s3123_rds:
  enabled: true
  share: consortium_factor                       # per_sc * s3123_factor, consortium-gated
  consortium_start: "2024-07-01"                 # hard floor on share eligibility (D5 fix)
  qs_to_ig: 0.20                                 # 20% QS back to IG -> net = gross * 0.80
  qs_to_ig_excluded: [14294, 13257, 10590]       # above IG max line -> retain 100%
  # FIX(recon 2026Q1, O2): the old code ignored `active` and applied attach=0,
  # which recovered the ENTIRE net — that is why the shipped book printed $0
  # for every S3123 net. Code now honors active:false and requires BOTH
  # attach > 0 and limit > 0 before applying. When the Agg XoL attaches,
  # enter its true attachment here and set active: true.
  agg_xol: { limit: 30000000, attach: null, active: false }  # consortium Agg XoL, 30m max/event; not attaching 2026Q1
  max_risk: true

  scenarios:
    proton_flare:   { type: full,         orbits: ["GEO-GSO"],                          loss: 0.05 }
    space_weather:  { type: bus_type_top, top_n: 4,                                     loss: 1.00 }
    generic_defect: { type: top_n_risks,  top_n: 10, orbits: ["GEO-GSO", "MEO"],        loss: 0.50, apply_rpf: true }
    # JJ's basis: 100% of LEO in the worst orbit range (RPF-adj), MAX of the
    # altitude groups (Group 1 = 400-800 km, Group 2 = 1200-1600 km).
    space_debris:   { type: orbit_group,  orbits: ["LEO"],                              apply_rpf: true,
                      altitude_groups: [ { name: "Group 1", low: 400,  high: 800 },
                                         { name: "Group 2", low: 1200, high: 1600 } ] }

  # Lloyd's population + bus type come from the Lloyd's views (same database).
  # NOTE (O1): the 2026Q1 run computed shares from the consortium-factor
  # schedule on the IG population. Aggregates tie JJ (PF to £3 post-fix) but
  # per-line shares differ from his actual signed lines, which moves the GD
  # top-10 (~1.0m) and SD. Preferred fix: ingest per-line shares from
  # vw_SpaceRDS_All_Lloyds_RDS. Also required for Space Weather: without the
  # bus-type join the SW cell renders "n/a" (it printed $0 in the shipped
  # book; the sheet now flags it instead).
  lloyds_source:
    # PREFERRED: spacecraft-keyed query for the Lloyd's bus-type group + altitude
    # (drives Space Weather + Space Debris; avoids the broken vw_SpaceRDS_*_Lloyds).
    spacecraft_attrs_query_file: "sql/lloyds_spacecraft_attrs.sql"
    bus_type_view:   "rds.vw_SpaceRDS_All_Lloyds_RDS"        # (fallback; mis-named)
    population_view: "rds.vw_SpaceRDS_SpaceWeather_Lloyds"   # S3123 on-risk population
    fallback_mapping_csv: null                              # optional CSV: layer_key,lloyds_bus_type

  # Lloyd's RDS Summary — the workbook's last tab (mirrors JJ). Prior column and
  # narrative are 2025Q4 → 2026Q1: the quarter the 20% S3123 QS to IG was first
  # applied, which stepped every net down ~15-18%.
  lloyds_summary:
    enabled: true
    rds_view:            "rds.vw_SpaceRDS_All_Lloyds_RDS"
    space_weather_view:  "rds.vw_SpaceRDS_SpaceWeather_Lloyds"
    risk_appetite_usd: 50000000
    previous_quarter_label: "2025Q4"
    previous_quarter:                                # 2025Q4 (pre-QS: net = gross)
      "Proton Flare":   { gross: 18666233, net: 18666233 }
      "Space Weather":  { gross: 41626793, net: 41626793 }
      "Generic Defect": { gross: 13758693, net: 13758693 }
      "Space Debris":   { gross: 10295981, net: 10295981 }
    qoq_note: >-
      Q-on-Q: the 20% S3123 QS to IG is applied for the first time this quarter,
      stepping every net down ~15-18% (net was 100% of gross in 2025Q4; 3
      spacecraft above the 30m IG line retain 100%). Gross is broadly flat except
      Space Debris, which jumps on ~10.6m of newly-incepted LEO exposure.
    change_narrative:
      "Proton Flare": >-
        Gross −$0.06m (−0.3%): broadly flat — a small GEO exposure decrease (net
        −1.3m; 5% ≈ −$64k). Net −$3.42m (−18.3%): the 20% S3123 QS to IG applies
        for the first time (not in the prior net; 3 excluded spacecraft retain
        100%), so net steps to ~80% of gross.
      "Space Weather": >-
        Gross ~flat: binding bus type unchanged (Airbus Eurostar 3000/NEO). Net
        −$6.11m (−14.7%): the new 20% QS to IG; Spainsat NG-1 is excluded, so net
        falls a little less than the full 20%.
      "Generic Defect": >-
        Gross +$0.19m (+1.4%): small top-10 moves — Spainsat NG-2 risk factor
        −1.1m, Thuraya 4-NGS +1.4m, Thales Alenia falls out of the top 10 −0.9m,
        +0.8m from the VIASAT-3 F2 off-risk data fix. Net −$2.15m (−15.6%): the
        new 20% QS to IG.
      "Space Debris": >-
        Gross +$10.49m (+101.8%): ~10.6m of LEO exposure incepted (≈0.1m expired),
        lifting the worst orbit-range group. Net +$6.33m (+61.5%): net rises less
        than gross under the new 20% S3123 QS to IG.

  # Tie-out to JJ's manual Lloyd's submission — renders the reconciliation
  # block on the S3123 RDS tab. Drop this whole key once the manual is retired.
  # gross/net = JJ's 2026Q1 reported figures; note = the RECONCILED explanation
  # (updated 2026-07-02 from the full bridge — every figure closed to the
  # dollar; see Space_RDS_2026Q1_Auto_vs_Manual_Bridge.xlsx).
  manual_compare:
    Proton Flare:
      gross: 18601901
      net: 15244128
      note: "Post-fix auto = 18,765,302: JJ + 137,388 (EUTELSAT 36D, timing) + 26,031 (MEASAT factor) - restatements. Closes to £3. The former +1.56m (SXM-10 + NUSANTARA LIMA) was a pipeline eligibility bug, now fixed - those lines are pre-consortium and JJ was right to exclude them."
    Space Weather:
      gross: 41626793
      net: 35518198
      note: "Match to -3 (rounding). Worst bus type = Airbus Eurostar 3000/NEO, top-4. Requires the Lloyd's bus-type join; without it the sheet shows n/a."
    Generic Defect:
      gross: 13758693
      net: null
      note: "Post-fix auto = 14,736,332 (top-10 by line). Auto correctly carries the VIASAT-3 F2 correction JJ flagged in his own GD tab (-773,196 at S3123 share, his figure). Residual ~1.0m = schedule-derived vs actual signed per-line shares moving the top-10 selection - OPEN (O1), agree share source with JJ."
    Space Debris:
      gross: 20781208
