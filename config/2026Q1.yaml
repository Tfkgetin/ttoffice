      note: "Auto = 22,860,711 (share x RPF on IG LEO set); JJ uses an altitude-grouped basis on the Lloyd's view (ALSAT 3A/3B, HOTSAT-2 populations differ). Method + population OPEN (O1) - agree with JJ before next filing."
