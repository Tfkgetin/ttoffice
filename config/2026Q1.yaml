# Space RDS pipeline — 2026Q1 parameters
# Single source of truth for the quarter. Next quarter: copy this file, update values.
# Every value traceable to the workbook tab noted in the comment.

quarter: "2026Q1"
as_at_date: "2026-04-01"            # Input Data AC15

# ---- Prior quarter (QoQ seeding) -------------------------------------------
# FIX(recon 2026Q1): seed the Changes / Exposure Bridge / Loss Movement sheets
# from the FROZEN quarter-close manual workbook — the correct filed prior.
# Do NOT create a prior by re-running the live view with --as-at <prior close>:
# the view rewinds the date filter only, so restatements (VIASAT, MEASAT, 36D)
# would pollute the prior and genuine movement would net to zero.
# Retire these two keys once a persisted pipeline run exists to compare against
# (i.e. from 2026Q2 onward, after this quarter's run is saved).
prior_workbook: "T:/Actuarial/Risk_and_Capital/PMLs/2025/Q4/Space/Space_RDS_2025Q4_template - including Equity Share.xlsx"
prior_as_at_label: "2026-01-01 (frozen 2025Q4 manual)"

# ---- Time decay (Risk Period Factor) -------- Input Data O10:P14
# Banded on full months between as-at date and Off_Risk_Date (largest band <= months)
rpf_bands:
  - { months: 0,   factor: 0.20 }
  - { months: 6,   factor: 0.40 }
  - { months: 12,  factor: 0.60 }
  - { months: 18,  factor: 0.80 }
  - { months: 999, factor: 1.00 }

# ---- LEO debris months-left bands ------------ Summary R4:S7 (lookup is MATCH+1 shifted)
leo_debris_rpf_bands:                # applied to AC (months left, LEO only)
  - { months: 0,  factor: 0.20 }
  - { months: 6,  factor: 0.40 }
  - { months: 12, factor: 0.60 }
  - { months: 18, factor: 0.80 }

# ---- Scenario parameters --------------------- Summary P3/P6/P9, U4:Y6
scenarios:
  proton_flare:
    insured_loss: 0.05               # Summary P9
    orbits: ["GEO-GSO"]
    apply_rpf: false
  generic_defect:
    insured_loss: 0.50               # Summary P3
    orbits: ["GEO-GSO", "MEO"]
    apply_rpf: true
  space_debris:
    insured_loss: 1.00               # Summary P6
    orbits: ["GEO-GSO", "MEO", "LEO"]   # Summary D8 includes all three orbits
    per_layer_block_orbits: ["GEO-GSO", "MEO"]  # Input Data CY block excludes LEO
    damage_by_orbit:                 # Summary U4:Y6 adjusted factors
      # IG book uses FLAT LEO 0.40 — confirmed on 2025Q4 where long-dated LEO
      # existed and the filed Summary still used 0.40 (banded would give 67.9m
      # vs the filed 61.2m). The banded leo_debris_rpf feeds the Lloyd's side.
      LEO: 0.40
      MEO: 0.10
      GEO-GSO: 0.05

# ---- IG Equity Share ------------------------- IG Equity Share tab (by inception year)
equity_share_by_year:
  2024: 0.099
  2025: 0.075
  2026: 0.075

# ---- S3123 consortium share factors ---------- S3123 Consortium Share tab
# XLOOKUP exact-or-next-smaller on layer inception date
s3123_consortium_factors:
  - { from: "2022-11-01", factor: 0.4166666666666667 }   # 12.5 / 30
  - { from: "2026-01-01", factor: 0.50 }                  # 15 / 30
  - { from: "2026-04-01", factor: 0.3333333333333333 }   # 10 / 30

# ---- S3123 inwards QS ------------------------ S3123 QS tab
# FIX(recon 2026Q1, D5): window opens at the CONSORTIUM START, not 2022-11-01.
# The old 2022-11-01 window + live is_consortium restating TRUE for spacecraft
# 17163 (SXM-10) / 17950 (NUSANTARA LIMA) — both 2022, pre-consortium — put
# spurious S3123 QS into FIHL (+312.5k PF/SD, +916.7k GD, +3.33m Max Risk).
# Earliest legitimate S3123 layer incepts 2024-12-15, so this is loss-free.
# consortium_start is also enforced as a hard floor in engine.py / s3123.py,
# so a wrong flag can never leak pre-consortium business again.
# NOTE: excluded_spacecraft means "consortium but retains 100% — no QS ceded
# back to IG" (they still carry equity + an S3123 share). Do NOT use it to fix
# wrong is_consortium flags.
s3123_qs:
  cession: 0.20
  date_from: "2024-07-01"            # was 2022-11-01 (pre-consortium)
  date_to: "2026-12-31"
  consortium_start: "2024-07-01"
  excluded_spacecraft: [14294, 13257, 10590]

# ---- IGR Quota Share ------------------------- IGR QS tab (entity+mapping_code+year)
# Defaults per entity, with (entity, mapping_code, year) overrides from the tab
igr_qs:
  default:
    FUL: 0.50
    FIID: 0.85
    FIBL: 0.00
    FIHL: 0.00
  overrides:                       # IGR QS tab rows where cession differs from default
    - { entity: FUL, code: ASC, year: 2021, cession: 0.40 }
    - { entity: FUL, code: ASC, year: 2022, cession: 0.40 }
    - { entity: FUL, code: ASL, year: 2021, cession: 0.40 }
    - { entity: FUL, code: ASL, year: 2022, cession: 0.40 }
    - { entity: FUL, code: ASO, year: 2022, cession: 0.40 }   # note: ASO 2021 stays 0.50
    - { entity: FUL, code: ASR, year: 2021, cession: 0.40 }
    - { entity: FUL, code: ASR, year: 2022, cession: 0.40 }

# ---- IGR XoL --------------------------------- IGR XoL tab B17:F19
igr_xol:
  FUL:  { limit: 245000000, deductible: 50000000 }
  FIID: { limit: 72500000,  deductible: 7500000 }

