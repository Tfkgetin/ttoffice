exclude_placing_basis:
  - "Consortium"

# ============================================================================
# S3123 (Syndicate 3123 / Lloyd's) RDS
# ----------------------------------------------------------------------------
# Produces Syndicate 3123's OWN return, reported on a separate "S3123 RDS" tab,
# alongside the IG book. Automated via spacepkg/s3123.py + s3123_sheet.py.
# Same RPF bands + per-risk loss formula as IG; differs only in:
#   * share      : S3123 sub-share = per_sc * s3123_factor (12.5/30, 15/30,
#                  10/30), GATED by consortium eligibility (FIX recon 2026Q1:
#                  the gate was missing — non-consortium 2022 lines leaked in
#                  and SXM-10 wrongly became the syndicate Max Risk)
#   * selection  : Lloyd's caps (see scenarios below)
#   * SD damage  : share * RPF (time-decay) — NOT the IG flat 0.40 LEO ratio.
#                  OPEN (O1): JJ's 2026Q1 workings use an altitude-grouped
#                  basis; method + per-line share source (schedule-derived vs
#                  actual signed lines from the Lloyd's view) to be agreed
#                  with JJ before next filing.
#   * netting    : net = gross * 0.80 = 20% QS ceded back to IG (same cession
#                  that lands in the IG number as s3123_qs; excluded s/c retain 100%)
# ============================================================================
s3123_rds:
  enabled: true
  share: consortium_factor                       # per_sc * s3123_factor, consortium-gated
  consortium_start: "2024-07-01"                 # hard floor on share eligibility (D5 fix)
  qs_to_ig: 0.20                                 # 20% QS back to IG -> net = gross * 0.80
  qs_to_ig_excluded: [14294, 13257, 10590]       # above IG max line -> retain 100%
  # FIX(recon 2026Q1, O2): the old code ignored `active` and applied attach=0,
  # which recovered the ENTIRE net — that is why the shipped book printed $0
  # for every S3123 net. Code now honors active:false and requires BOTH
  # attach > 0 and limit > 0 before applying. When the Agg XoL attaches,
  # enter its true attachment here and set active: true.
  agg_xol: { limit: 30000000, attach: null, active: false }  # consortium Agg XoL, 30m max/event; not attaching 2026Q1
  max_risk: true

  scenarios:
    proton_flare:   { type: full,         orbits: ["GEO-GSO"],                          loss: 0.05 }
    space_weather:  { type: bus_type_top, top_n: 4,                                     loss: 1.00 }
    generic_defect: { type: top_n_risks,  top_n: 10, orbits: ["GEO-GSO", "MEO"],        loss: 0.50, apply_rpf: true }
    space_debris:   { type: orbit_group,  orbits: ["LEO"],                              apply_rpf: true }   # share * RPF — method open (O1)

  # Lloyd's population + bus type come from the Lloyd's views (same database).
  # NOTE (O1): the 2026Q1 run computed shares from the consortium-factor
  # schedule on the IG population. Aggregates tie JJ (PF to £3 post-fix) but
  # per-line shares differ from his actual signed lines, which moves the GD
  # top-10 (~1.0m) and SD. Preferred fix: ingest per-line shares from
  # vw_SpaceRDS_All_Lloyds_RDS. Also required for Space Weather: without the
  # bus-type join the SW cell renders "n/a" (it printed $0 in the shipped
  # book; the sheet now flags it instead).
  lloyds_source:
    bus_type_view:   "rds.vw_SpaceRDS_All_Lloyds_RDS"        # layer -> Lloyds Bus Type
    population_view: "rds.vw_SpaceRDS_SpaceWeather_Lloyds"   # S3123 on-risk population
    fallback_mapping_csv: null                              # optional CSV: layer_key,lloyds_bus_type

  # manual_compare: RETIRED from 2026Q2 - there is no manual book to tie to.
  # The S3123 RDS tab renders without the reconciliation block.
