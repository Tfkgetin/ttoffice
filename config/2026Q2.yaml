# Space RDS pipeline — 2026Q1 parameters
# Single source of truth for the quarter. Next quarter: copy this file, update values.
# Every value traceable to the workbook tab noted in the comment.

quarter: "2026Q2"
as_at_date: "2026-07-01"

# ---- Prior quarter (QoQ seeding) -------------------------------------------
# FIX(recon 2026Q1): seed the Changes / Exposure Bridge / Loss Movement sheets
# from the FROZEN quarter-close manual workbook — the correct filed prior.
# Do NOT create a prior by re-running the live view with --as-at <prior close>:
# the view rewinds the date filter only, so restatements (VIASAT, MEASAT, 36D)
# would pollute the prior and genuine movement would net to zero.
# Retire these two keys once a persisted pipeline run exists to compare against
# (i.e. from 2026Q2 onward, after this quarter's run is saved).
