prior_as_at_label: "2026-04-01 (2026Q1 auto book)"

# ---- Manual inclusions -----------------------------------------------------
# UW-confirmed single layers to carry because their renewal is not yet bound /
# entered in source as-at the run date. Injected at ingest so they flow through
# the WHOLE book (engine → scenarios → netting → Summary → Max Risk → Changes);
# the engine recomputes rpf / cessions / scenario losses. The spacecraft-level
# double-count safeguard retires an entry once the source binds the renewal.
# Use this list for ONE-OFF layers; for a whole-programme renewal use
# `renewal_rollforward` below (clones the entire prior-book programme).
#
# The Eutelsat fleet (344558 → 385575) is now carried by renewal_rollforward,
# NOT here — the 4 hand entries below are disabled (superseded) and kept only for
# reference; delete once the roll-forward is trusted.
manual_include:
  # - {program_id: 385575, layer_id: 1,  spacecraft_id: 16310, spacecraft_name: "EUTELSAT 36D", entity: FIID, mapping_code: ASO, orbit: GEO-GSO, bus_manufacturer: "Airbus Defence and Space",             is_consortium: false, inception: "2026-07-01", on_risk_date: "2026-07-01", off_risk_date: "2027-06-30", layer_signed_exposure: 19814782.42, renewed_from_program_id: 344558, renewal_uw_status: "Quoted/Awaiting FOT", renewal_snapshot: "2026-07-05", reason: "Eutelsat 36D renewal — superseded by renewal_rollforward"}
  # - {program_id: 385575, layer_id: 20, spacecraft_id: 13009, spacecraft_name: "E13G",         entity: FIID, mapping_code: ASO, orbit: GEO-GSO, bus_manufacturer: "Airbus Defence and Space (Toulouse)",  is_consortium: false, inception: "2026-07-01", on_risk_date: "2026-07-01", off_risk_date: "2027-06-30", layer_signed_exposure: 19814782.42, renewed_from_program_id: 344558, renewal_uw_status: "Quoted/Awaiting FOT", renewal_snapshot: "2026-07-05", reason: "Eutelsat E13G renewal — superseded by renewal_rollforward"}
  # - {program_id: 385575, layer_id: 22, spacecraft_id: 14159, spacecraft_name: "E10B",         entity: FIID, mapping_code: ASO, orbit: GEO-GSO, bus_manufacturer: "Thales Alenia Space France (Cannes)", is_consortium: false, inception: "2026-07-01", on_risk_date: "2026-07-01", off_risk_date: "2027-06-30", layer_signed_exposure: 19814782.42, renewed_from_program_id: 344558, renewal_uw_status: "Quoted/Awaiting FOT", renewal_snapshot: "2026-07-05", reason: "Eutelsat E10B renewal — superseded by renewal_rollforward"}
  # - {program_id: 385575, layer_id: 23, spacecraft_id: 13008, spacecraft_name: "E13F",         entity: FIID, mapping_code: ASO, orbit: GEO-GSO, bus_manufacturer: "Airbus Defence and Space (Toulouse)",  is_consortium: false, inception: "2026-07-01", on_risk_date: "2026-07-01", off_risk_date: "2027-06-30", layer_signed_exposure: 19814782.42, renewed_from_program_id: 344558, renewal_uw_status: "Quoted/Awaiting FOT", renewal_snapshot: "2026-07-05", reason: "Eutelsat E13F renewal — superseded by renewal_rollforward"}
  # Turksat 6A renewal (377766) is now carried by the renewal_rollforward rule
  # below (341429 → 377766) at the Q1 book's ceded line — see notes there.

# ---- Renewal roll-forward --------------------------------------------------
# For a UW-CONFIRMED whole-programme renewal whose successor isn't yet in source
# (not bound / not entered), clone EVERY prior-book layer of `from_program` into
# `to_program` at the renewal dates — carrying each bird's spacecraft, entity,
# orbit, manufacturer and Q1 exposure so scenario granularity (Space Weather by
# manufacturer, Max Risk single-sat) is preserved. Generated layers are injected
# exactly like manual_include (whole engine) and shown on Python Adjustments; the
# spacecraft-level double-count safeguard retires each once the source binds it.
# Eutelsat: J.Pbi confirms programme 344558 renews to 385575 (Quoted/Awaiting
# FOT); UW confirmed the whole-fleet renewal. The source models 344558 as 2 fleet
# lines, but the Q1 manual book disaggregates it into 23 per-spacecraft rows — the
# roll-forward carries all 23 forward.
renewal_rollforward:
  - from_program: 344558
    to_program: 385575
    inception: "2026-07-01"
    on_risk_date: "2026-07-01"
    off_risk_date: "2027-06-30"
    mapping_code: ASO
    renewal_uw_status: "Quoted/Awaiting FOT"
    renewal_snapshot: "2026-07-05"
    reason: "Eutelsat fleet renewal 344558 → 385575 — UW-confirmed whole-fleet renewal; carried at Q1 line size, source renewal not yet bound"
  # Turksat 6A: renewal 377766 (Proportional Facultative, bound) was dropped by
  # the auto-extract because the MGU param_consortium_splits table didn't cover
  # its 2026-04-10 inception. That split row has since been ADDED (MGU 2026-04-01→
  # 2026-06-30, cession 0.5882), so 377766 now flows from source at ~$9.12m and
  # this roll-forward is REDUNDANT — it auto-retires via the spacecraft-level
  # double-count safeguard (you'll see "1 manual inclusion skipped"). SAFETY NET
  # ONLY: delete this rule once a run confirms 377766 comes through from source.
  # (The 387554 declarations are Consortium Declaration → excluded by methodology.)
  - from_program: 341429
    to_program: 377766
    inception: "2026-04-10"
    on_risk_date: "2026-04-10"
    off_risk_date: "2027-04-09"
    mapping_code: ASO
    renewal_uw_status: "Bound (Signed Off)"
    renewal_snapshot: "2026-07-05"
    reason: "Turksat 6A renewal 341429 → 377766 — MGU split (2026-04-01→06-30, 0.5882) now added, so 377766 flows from source (~$9.12m); this is a self-retiring safety net (double-count safeguard skips it) — delete once a run confirms 377766 from source"
  # PENDING UW SIGN-OFF — two whole-fleet renewals confirmed by data (J.Pbi
  # 2026-07-05): both IsBound=0, Direct Open Market (no cession), signed=0 (no
  # source exposure yet), every expiring layer points to the single successor.
  # Uncomment each once the UW confirms the fleet renews (as JJ did for Eutelsat).
  # ~$140m combined; verify the Arabsat prior-book count (6 birds vs 12 source
  # expiring layers) with the UW before relying on it. Arabsat is at NBI stage
  # (earlier/less certain) than Inmarsat GX (Quoted/Awaiting FOT).
  # - {from_program: 344664, to_program: 382904, inception: "2026-07-01", on_risk_date: "2026-07-01", off_risk_date: "2027-06-30", mapping_code: ASO, renewal_uw_status: "NBI", renewal_snapshot: "2026-07-05", reason: "Arabsat fleet renewal 344664 → 382904 — pending UW sign-off; unbound (NBI), carried at Q1 line size"}
  # - {from_program: 343724, to_program: 385466, inception: "2026-07-01", on_risk_date: "2026-07-01", off_risk_date: "2027-06-30", mapping_code: ASO, renewal_uw_status: "Quoted/Awaiting FOT", renewal_snapshot: "2026-07-05", reason: "Inmarsat GX fleet renewal 343724 → 385466 — pending UW sign-off; unbound (Quoted), carried at Q1 line size"}

# ---- Time decay (Risk Period Factor) -------- Input Data O10:P14
# Banded on full months between as-at date and Off_Risk_Date (largest band <= months)
rpf_bands:
  - { months: 0,   factor: 0.20 }
  - { months: 6,   factor: 0.40 }
  - { months: 12,  factor: 0.60 }
  - { months: 18,  factor: 0.80 }
  - { months: 999, factor: 1.00 }

# ---- LEO debris months-left bands ------------ Summary R4:S7 (lookup is MATCH+1 shifted)
leo_debris_rpf_bands:                # applied to AC (months left, LEO only)
  - { months: 0,  factor: 0.20 }
  - { months: 6,  factor: 0.40 }
  - { months: 12, factor: 0.60 }
  - { months: 18, factor: 0.80 }

# ---- Scenario parameters --------------------- Summary P3/P6/P9, U4:Y6
scenarios:
  proton_flare:
    insured_loss: 0.05               # Summary P9
    orbits: ["GEO-GSO"]
    apply_rpf: false
  generic_defect:
    insured_loss: 0.50               # Summary P3
    orbits: ["GEO-GSO", "MEO"]
    apply_rpf: true
  space_debris:
    insured_loss: 1.00               # Summary P6
    orbits: ["GEO-GSO", "MEO", "LEO"]   # Summary D8 includes all three orbits
    per_layer_block_orbits: ["GEO-GSO", "MEO"]  # Input Data CY block excludes LEO
    damage_by_orbit:                 # Summary U4:Y6 adjusted factors
      # IG book uses FLAT LEO 0.40 — confirmed on 2025Q4 where long-dated LEO
      # existed and the filed Summary still used 0.40 (banded would give 67.9m
      # vs the filed 61.2m). The banded leo_debris_rpf feeds the Lloyd's side.
      LEO: 0.40
      MEO: 0.10
      GEO-GSO: 0.05

