# ---- S3123 inwards QS ------------------------ S3123 QS tab
# FIX(recon 2026Q1, D5): window opens at the CONSORTIUM START, not 2022-11-01.
# The old 2022-11-01 window + live is_consortium restating TRUE for spacecraft
# 17163 (SXM-10) / 17950 (NUSANTARA LIMA) — both 2022, pre-consortium — put
# spurious S3123 QS into FIHL (+312.5k PF/SD, +916.7k GD, +3.33m Max Risk).
