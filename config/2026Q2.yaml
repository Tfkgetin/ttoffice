# ---- Pipeline-side population exclusions ----
# Drop layers whose Placing_Basis matches (case-insensitive). The SQL view only
# filters 'Consortium Declaration'; this removes plain 'Consortium' too without
# altering shared SQL. Excluded layers are listed on the Excluded sheet.
exclude_placing_basis:
  - "Consortium"

# ============================================================================
# S3123 (Syndicate 3123 / Lloyd's) RDS
# ----------------------------------------------------------------------------
# Produces Syndicate 3123's OWN return, reported on a separate "S3123 RDS" tab,
# alongside the IG book. Automated via spacepkg/s3123.py + s3123_sheet.py.
# Same RPF bands + per-risk loss formula as IG; differs only in:
#   * share      : S3123 sub-share = per_sc * s3123_factor (12.5/30, 15/30,
#                  10/30), GATED by consortium eligibility (FIX recon 2026Q1:
#                  the gate was missing — non-consortium 2022 lines leaked in
#                  and SXM-10 wrongly became the syndicate Max Risk)
#   * selection  : Lloyd's caps (see scenarios below)
#   * SD damage  : share * RPF (time-decay) — NOT the IG flat 0.40 LEO ratio.
#                  OPEN (O1): JJ's 2026Q1 workings use an altitude-grouped
#                  basis; method + per-line share source (schedule-derived vs
#                  actual signed lines from the Lloyd's view) to be agreed
#                  with JJ before next filing.
#   * netting    : net = gross * 0.80 = 20% QS ceded back to IG (same cession
#                  that lands in the IG number as s3123_qs; excluded s/c retain 100%)
# ============================================================================
s3123_rds:
  enabled: true
  share: consortium_factor                       # per_sc * s3123_factor, consortium-gated
  consortium_start: "2024-07-01"                 # hard floor on share eligibility (D5 fix)
  qs_to_ig: 0.20                                 # 20% QS back to IG -> net = gross * 0.80
  qs_to_ig_excluded: [14294, 13257, 10590]       # above IG max line -> retain 100%
  # FIX(recon 2026Q1, O2): the old code ignored `active` and applied attach=0,
  # which recovered the ENTIRE net — that is why the shipped book printed $0
  # for every S3123 net. Code now honors active:false and requires BOTH
  # attach > 0 and limit > 0 before applying. When the Agg XoL attaches,
  # enter its true attachment here and set active: true.
  agg_xol: { limit: 30000000, attach: null, active: false }  # consortium Agg XoL, 30m max/event; not attaching 2026Q1
  max_risk: true

  scenarios: &s3123_scenarios
    proton_flare:   { type: full,         orbits: ["GEO-GSO"],                          loss: 0.05 }
    space_weather:  { type: bus_type_top, top_n: 4,                                     loss: 1.00 }
    # JJ's FILED basis (per vw_SpaceRDS_Generic_Defect_Lloyds): sum of the TOP 10
    # satellite losses = exposure x risk_factor(RPF) x loss_rate(0.50). His
    # Change-Narrative wording ("largest manufacturer") is misleading — the view
    # sums the top-10, so that is what we mirror. (SEP validated to ~$1; GD/SD
    # tie exactly once the run reads JJ's Lloyd's population — see the sub-views.)
    generic_defect: { type: top_n_risks, top_n: 10, orbits: ["GEO-GSO", "MEO"],         loss: 0.50, apply_rpf: true }
    # JJ's filed basis: 100% of LEO in the worst orbit range (RPF-adj), MAX of
    # the altitude groups. Group 1 = 600±200 (400-800 km), Group 2 = 1400±200
    # (1200-1600 km) per rds.params_lloyds_proton_flare_altitude. Uses altitude_km
    # (ingest attaches it); falls back to all-LEO if altitude is missing.
    space_debris:   { type: orbit_group,  orbits: ["LEO"],                              apply_rpf: true,
                      altitude_groups: [ { name: "Group 1", low: 400,  high: 800 },
                                         { name: "Group 2", low: 1200, high: 1600 } ] }

  # Lloyd's population + bus type come from the Lloyd's views (same database).
  # NOTE (O1): the 2026Q1 run computed shares from the consortium-factor
  # schedule on the IG population. Aggregates tie JJ (PF to £3 post-fix) but
  # per-line shares differ from his actual signed lines, which moves the GD
  # top-10 (~1.0m) and SD. Preferred fix: ingest per-line shares from
  # vw_SpaceRDS_All_Lloyds_RDS. Also required for Space Weather: without the
  # bus-type join the SW cell renders "n/a" (it printed $0 in the shipped
  # book; the sheet now flags it instead).
  lloyds_source:
    # PREFERRED: a spacecraft-keyed query (Bus Type × Bus Manufacturer -> Lloyd's
    # bus-type group, + latest altitude). Avoids the broken vw_SpaceRDS_*_Lloyds
    # views; drives Space Weather (bus type) and Space Debris (altitude groups).
    spacecraft_attrs_query_file: "sql/lloyds_spacecraft_attrs.sql"
    bus_type_view:   "rds.vw_SpaceRDS_All_Lloyds_RDS"        # (fallback; mis-named)
    population_view: "rds.vw_SpaceRDS_SpaceWeather_Lloyds"   # S3123 on-risk population
    fallback_mapping_csv: null                              # optional CSV: layer_key,lloyds_bus_type

  # Lloyd's RDS Summary — JJ's filed deliverable, integrated as the workbook's
  # LAST tab. The RDS methodology lives in these two pre-computed DB views, so
  # the tab reads them verbatim and ties to his 'Lloyds RDS Summary-final' to
  # the dollar (no re-derivation). rds_view = the 4 headline RDS
  # (RDS_Name / RDS_Value / Breaches_Risk_Appetite); space_weather_view = the
  # bus-type block (Bus Type / Aggregate / Top 4 / > Risk Appetite).
  # NB these are the CORRECT view roles — `lloyds_source.bus_type_view` above is
  # mis-named (it points at the 4-RDS summary, not a layer->bus-type map, which
  # is why Space Weather on the computed S3123 tab renders n/a).
  lloyds_summary:
    enabled: true
    rds_view:            "rds.vw_SpaceRDS_All_Lloyds_RDS"
    space_weather_view:  "rds.vw_SpaceRDS_SpaceWeather_Lloyds"
    risk_appetite_usd: 50000000              # rds.params_Risk_Appetite_Lloyds — flags breaches
    # One-line Q-on-Q narrative rendered under the RDS table (edit per quarter).
    qoq_note: >-
      Q-on-Q: the S3123 consortium sub-share stepped down from 15/30 (0.500) to
      10/30 (0.333) for inceptions on/after 2026-04-01, so the renewed GEO fleet
      (Eutelsat / Inmarsat GX / Arabsat / Turksat, carried in at 2026-07-01) is
      refreshed but written on the lower 0.333 syndicate line — Solar-particle
      and Design-deficiency fall despite the renewals. Space Debris reflects LEO
      run-off; Generic Defect the top-10 reselection. No RDS breaches appetite.
    # Per-RDS change narrative (gross + net drivers) — edit per quarter.
    change_narrative:
      "Proton Flare": >-
        Gross −$3.54m (−19%): the renewed GEO consortium fleet (Eutelsat, Inmarsat
        GX, Arabsat, Turksat) is carried in on the reduced 10/30 (0.333) S3123
        sub-share vs 15/30 (0.500) last quarter — the same fleet writes a smaller
        syndicate line. Net −$3.13m (−21%): net falls a little further than gross
        as excluded, 100%-retained birds (chiefly Spainsat NG-1, which renews
        1-Aug and is off-book this quarter) leave the population, so the 20% QS to
        IG bites more fully (net/gross 0.82 → 0.80).
      "Space Weather": >-
        Gross −$6.03m (−14%): binding bus type unchanged (Airbus Eurostar
        3000/NEO); the top-4 exposures fall on the same 0.500 → 0.333 share
        step-down. Net −$7.04m (−20%): net drops further as the previously
        100%-retained excluded birds leave the top-4, so the 20% QS applies more
        fully (net/gross 0.85 → 0.80).
      "Generic Defect": >-
        Gross +$2.37m (+17%): the top-10 GEO/MEO losses reselect — renewed and
        added GEO exposure and the RPF profile push larger risks into the top-10,
        outweighing the lower share. Net +$1.70m (+15%): net rises broadly in line
        with gross at ~0.82 retention.
      "Space Debris": >-
        Gross −$7.45m (−36%): LEO run-off in the worst orbit-range group (Group 1),
        NOT a share-factor effect — the LEO fleet all incepted pre-2026-04-01, so
        its consortium factor is unchanged (0.4167/0.500). Main driver: the OLD
        WorldView Legion programme (341568) expired off-risk 2026-05-02 — in Q1 it
        and its bound renewal (369418) were both on-risk (renewal overlap) and both
        counted, by Q2 only the renewal remains, roughly halving Legion's Space-
        Debris exposure. Pleiades Neo 3 & 4 also ran off; partly offset by new LEO
        business (EarthDaily, HotSat). Net −$5.96m (−36%): moves in line with gross
        at the full 20% QS (no excluded LEO birds).
    # JJ's filed 2026Q1 Lloyd's RDS — shown as the prior column on the tab.
    previous_quarter_label: "2026Q1 (JJ filed)"
    previous_quarter:
      "Proton Flare":   { gross: 18601901, net: 15244128 }   # SEP — 5% all GEO
      "Space Weather":  { gross: 41626793, net: 35518198 }   # Design deficiency
      "Generic Defect": { gross: 13946588, net: 11613333 }
      "Space Debris":   { gross: 20781208, net: 16624966 }

  # manual_compare: RETIRED from 2026Q2 - there is no manual book to tie to.
  # The S3123 RDS tab renders without the reconciliation block.

# ============================================================================
# S2126 — new consortium participant from 2026-04-01 (Syndicate 2126)
# ----------------------------------------------------------------------------
# On 01/04/2026 S3123 dropped its consortium share 15/30 -> 10/30 and S2126
# picked up the 5/30 that was released (IG base 30, TPC 6 unchanged). S2126 has
# NO QS-to-IG agreement, so it does NOT touch the IG book — the S3123 QS-to-IG
# and IG equity correctly fall with the 0.333 factor and are NOT offset. S2126
# gets its OWN syndicate RDS (same methodology as S3123), retaining 100%.
# UW (John McGuinness): controlling-body id = 7; "very very small exposure".
# UW-CONFIRMED: S2126 sits on the same consortium-eligible population as S3123,
# and the S3123 "above-IG-line" exclusion list does NOT apply to S2126.
# ----------------------------------------------------------------------------
# S2126 consortium sub-share schedule (XLOOKUP exact-or-next-smaller on
# inception): 0 before participation, 5/30 from 2026-04-01.
s2126_consortium_factors:
  - { from: "1900-01-01", factor: 0.0 }                   # pre-participation
  - { from: "2026-04-01", factor: 0.16666666666666666 }   # 5 / 30

s2126_rds:
  enabled: true
  share: consortium_factor                       # per_sc * s2126_factor, consortium-gated
  consortium_start: "2024-07-01"                 # same eligibility floor as S3123
  qs_to_ig: 0.0                                  # NO QS to IG -> net = gross (retains 100%)
  qs_to_ig_excluded: []                          # moot with qs_to_ig=0 (all retain 100%)
  agg_xol: { limit: 30000000, attach: null, active: false }
  max_risk: true
  scenarios: *s3123_scenarios                    # identical scenario set to S3123
  controlling_body_id: 7                          # UW reference (Controlling_Bodies_t)

  # Polished Lloyd's RDS Summary tab for S2126 (mirrors S3123's last tab).
  lloyds_summary:
    enabled: true
    risk_appetite_usd: 50000000            # assumed same as S3123 — confirm S2126's own with UW
    qoq_note: >-
      New consortium participant: S2126 took the 5/30 (0.167) share that S3123
      released on 2026-04-01. Its own RDS is computed on the same population and
      methodology as S3123 but at the 5/30 line and with NO QS to IG (net =
      gross, retains 100%). No prior quarter — S2126 did not participate before
      2026-04-01 — so there is no Q-on-Q column. Very small exposure.
    change_narrative:
      "Proton Flare": >-
        5% of GEO on the S2126 5/30 share; new participation from 2026-04-01,
        no prior. Net = gross (no QS to IG).
      "Space Weather": >-
        Worst single bus type (top-4 aggregate) at the 5/30 share. Net = gross.
      "Generic Defect": >-
        Top-10 GEO/MEO losses (RPF-adjusted, 50%) at the 5/30 share. Net = gross.
      "Space Debris": >-
        Worst LEO altitude group (RPF-adjusted) at the 5/30 share. Net = gross.
